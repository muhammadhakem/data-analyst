<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Data Analyst Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#0f172a;
  --accent:#6366f1;--accent2:#8b5cf6;--muted:#64748b;--danger:#ef4444;
  --success:#22c55e;--warn:#f59e0b;
  --sidebar-w:260px;--header-h:52px;
}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column}

/* ── sidebar ── */
#sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:100;transition:transform .2s;
}
.sidebar-brand{
  padding:14px 18px;font-size:.95rem;font-weight:700;
  border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;letter-spacing:.3px;
}
.sidebar-accounts{
  flex:1;overflow-y:auto;padding:8px 0;
}
.acc-btn{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  cursor:pointer;border:none;background:none;width:100%;
  text-align:left;font-size:.875rem;color:var(--text);
  transition:background .15s;
}
.acc-btn:hover{background:#f1f5f9}
.acc-btn.active{background:#eef2ff;color:var(--accent);font-weight:600}
.acc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sidebar-footer{padding:10px 16px;border-top:1px solid var(--border)}
.credits{font-size:.7rem;color:var(--muted);text-align:center}

/* ── main ── */
#main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
#header{
  height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50;
}
#sheet-name{font-weight:600;font-size:.9rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#refresh-btn{
  padding:6px 14px;font-size:.8rem;font-weight:600;
  background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;
}
#refresh-btn:hover{background:#4f46e5}
#refresh-btn:disabled{opacity:.5;cursor:not-allowed}

#content{padding:20px;flex:1}

/* ── summary cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.card.green::before{background:var(--success)}
.card.red::before{background:var(--danger)}
.card.warn::before{background:var(--warn)}
.card-label{font-size:.7rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card-val{font-size:1.6rem;font-weight:700}
.card-sub{font-size:.72rem;color:var(--muted);margin-top:3px}

/* ── table ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead th{
  background:#f8fafc;padding:10px 14px;text-align:left;font-weight:700;
  font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
  border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0;
}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:#f8faff}
tbody td{padding:9px 14px;vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums}
.positive{color:var(--success);font-weight:600}
.negative{color:var(--danger);font-weight:600}

/* ── mobile toggle ── */
#menu-toggle{display:none;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:600;font-size:.85rem}

@media(max-width:680px){
  #sidebar{transform:translateX(calc(-1 * var(--sidebar-w) - 2px))}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #menu-toggle{display:block}
  .cards{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ══ SIDEBAR ══ -->
<div id="sidebar">
  <div class="sidebar-brand">📊 Data Analyst</div>
  <div class="sidebar-accounts" id="acc-list"></div>
  <div class="sidebar-footer"><div class="credits">Sheets → Dashboard<br>Vercel Deploy</div></div>
</div>

<!-- ══ MAIN ══ -->
<div id="main">
  <div id="header">
    <button id="menu-toggle">☰ Menu</button>
    <div id="sheet-name">Select a report</div>
    <button id="refresh-btn" onclick="loadActive()">↻ Refresh</button>
  </div>
  <div id="content">
    <div class="cards" id="summary-cards"></div>
    <div class="table-wrap"><table id="tbl"><thead id="tbl-head"></thead><tbody id="tbl-body"></tbody></table></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// CONFIG: Senarai sheet / account kau
// ══════════════════════════════════════════
const SHEETS = [
  {
    id: 'demo',
    label: 'Account 1 (Demo)',
    color: '#6366f1',
    spreadsheetId: 'SAMPLE_ID', // Replace dengan Spreadsheet ID kau
    sheet: '' // Nama Tab (kosongkan = tab pertama)
  }
];

let activeId = SHEETS[0]?.id || null;

async function fetchSheet(cfg) {
  // Service Account API endpoint (supports private & hidden sheets)
  const res = await fetch(`/api/sheet?spreadsheetId=${encodeURIComponent(cfg.spreadsheetId)}&sheet=${encodeURIComponent(cfg.sheet || '')}`);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || data.error || 'Fetch failed');
  return data;
}

function renderSidebar() {
  const list = document.getElementById('acc-list');
  list.innerHTML = SHEETS.map(s => `
    <button class="acc-btn${s.id === activeId ? ' active' : ''}" onclick="setActive('${s.id}')">
      <span class="acc-dot" style="background:${s.color}"></span>
      ${s.label}
    </button>`).join('');
}

function setActive(id) {
  activeId = id;
  renderSidebar();
  loadActive();
  if (window.innerWidth <= 680) document.getElementById('sidebar').classList.remove('open');
}

async function loadActive() {
  const cfg = SHEETS.find(s => s.id === activeId);
  if (!cfg) return;
  document.getElementById('sheet-name').textContent = cfg.label;
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;

  try {
    const { cols, rows } = await fetchSheet(cfg);
    renderCards(cols, rows);
    renderTable(cols, rows);
  } catch (err) {
    document.getElementById('summary-cards').innerHTML =
      `<div class="card" style="grid-column:1/-1;border-color:var(--danger)">
        <div class="card-label" style="color:var(--danger)">Status</div>
        <div style="font-size:0.85rem;color:var(--muted);margin-top:4px;">${err.message}</div>
      </div>`;
    document.getElementById('tbl-head').innerHTML = '';
    document.getElementById('tbl-body').innerHTML = '';
  } finally {
    btn.disabled = false;
  }
}

function renderCards(cols, rows) {
  const el = document.getElementById('summary-cards');
  el.innerHTML = `
    <div class="card">
      <div class="card-label">Total Rows</div>
      <div class="card-val">${rows.length.toLocaleString()}</div>
      <div class="card-sub">Data entries</div>
    </div>
    <div class="card green">
      <div class="card-label">Columns</div>
      <div class="card-val">${cols.length}</div>
      <div class="card-sub">Fields detected</div>
    </div>
  `;
}

function renderTable(cols, rows) {
  document.getElementById('tbl-head').innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
  document.getElementById('tbl-body').innerHTML = rows.map(r => `
    <tr>${r.map(v => `<td>${v ?? ''}</td>`).join('')}</tr>
  `).join('');
}

document.getElementById('menu-toggle').onclick = () => document.getElementById('sidebar').classList.toggle('open');
renderSidebar();
if (activeId) loadActive();
</script>
</body>
</html>
